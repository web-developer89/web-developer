    <title>Studio 89 — Websites, die etwas können.</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('studio89-appearance')
          if (raw) {
            var parsed = JSON.parse(raw)
            document.documentElement.dataset.theme = parsed.theme === 'light' ? 'light' : 'dark'
            document.documentElement.dataset.accent = parsed.accent || 'midnight'
            return
          }
        } catch (e) {}
        document.documentElement.dataset.theme = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
          ? 'dark'
          : 'light'
        document.documentElement.dataset.accent = 'midnight'
      })()
    </script>
